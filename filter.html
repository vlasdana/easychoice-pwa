    <meta charset="utf-8" />

  <body class="fullscreen">
    <script src="main.js"></script>
    <div class="flexcol">
      <div class="headerbox">
        <button class="backbutton" onclick="history.back()">&lt;</button>
        <div class="subTitle" width="60%">Speisekarte filtern</div>
        <div class="subtitle_rightspace"></div>
      </div>

      <div class="checkboxesbox">
        <div class="flexrow">
          <div class="checkbox_box">
            <div class="flexcol" width="30%"></div>
            <input type="checkbox" id="vegetarian" value="isVegetarian" />
          </div>
          <div class="checkbox_text">
            <label for="vegetarian">vegetarisch</label>
          </div>
        </div>
        <div class="flexrow">
          <div class="checkbox_box">
            <input type="checkbox" id="vegan" value="isVegan" />
          </div>
          <div class="checkbox_text">
            <label for="vegan">vegan</label>
          </div>
        </div>
        <div class="flexrow">
          <div class="checkbox_box">
            <input type="checkbox" id="lFree" value="isLFree" />
          </div>
          <div class="checkbox_text">
            <label for="lFree">laktosefei</label>
          </div>
        </div>
      </div>
      <div class="paragraph">
        <p>Das schmeckt mir nicht:</p>
      </div>
      <select id="dropdownIngredients" title="Ingredients">
        <option value="Gib ein Zutat ein">Gib eine Zutat ein</option>
        <option value="Zwiebel">Zwiebel</option>
        <option value="Knoblauch">Knoblauch</option>
        <option value="Mehl">Mehl</option>
        <option value="Milch">Milch</option>
        <option value="Nüsse">Nüsse</option>
      </select>
      <button id="selectIngredient" onclick="">zu Filter hinzufügen</button>
      <label for="meineFilter" class="green-label">Meine Filter:</label>
      <textarea
        id="meineFilter"
        name="meineFilter"
        rows="5"
        cols="10"
        maxlength="60"
      ></textarea>
      <div class="filterButtons">
        <button id="btn_reset" action="">zurücksetzen</button>
        <button id="btn_addtoFilter" action="">übernehmen</button>
      </div>
    </div>

    <!-- Scripts -->
    <script src="use_webworker.js"></script>
    <script src="use_serviceworker.js"></script>
    <!--
      <input class="back_button" type=button onClick="parent.location='index.html'" value='Back'>
    -->
  </body>
</html>
