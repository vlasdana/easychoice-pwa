<!DOCTYPE html>
<html lang="de">

  <head>
    <meta charset="utf-8">
    <title>Kategorien</title>

    <link rel="icon" href="img/ordericon.png">

    <!-- Manifest and Styles
	  The manifest file lists all the information about the website in a JSON format und usually resides in the root folder of a web app -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

    <!-- App Name -->
    <meta name="application-name" content="Easy choice menu PWA" />
    <!-- On iOS, you can specify a web application title for the launch icon -->
    <meta name="apple-mobile-web-app-title" content="Easy choice menu PWA" />

    <!-- Capability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Hiding Safari User Interface Components in standalone mode-->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Starting URL -->
    <meta name="msapplication-starturl" content="/index.html" />

    <!-- Theme/Display -->
    <meta name="theme-color" content="#FBFBFB"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <!-- Icon for iOS 180x180 -->
    <link rel="apple-touch-icon" href="img/touch-icon-iphone.png">

    <!-- Splash Screens for iOS -->
    <link href="img/apple_splash_2048.png" sizes="2048x2732" rel="apple-touch-startup-image" />
    <link href="img/apple_splash_1668.png" sizes="1668x2224" rel="apple-touch-startup-image" />
    <link href="img/apple_splash_1536.png" sizes="1536x2048" rel="apple-touch-startup-image" />
    <link href="img/apple_splash_1125.png" sizes="1125x2436" rel="apple-touch-startup-image" />
    <link href="img/apple_splash_1242.png" sizes="1242x2208" rel="apple-touch-startup-image" />
    <link href="img/apple_splash_750.png" sizes="750x1334" rel="apple-touch-startup-image" />
    <link href="img/apple_splash_640.png" sizes="640x1136" rel="apple-touch-startup-image" />
    <script src="main.js" defer></script>
  </head>

  <body class="fullscreen">
    
    <div class="flexcol">

    <div class="headerbox">
      <div class="restaurantTitle" id="restaurantName">Mein Restaurant</div>
    </div>

    <div class="headerbox">  
      <div class="subTitle">Speisen und Getränke</div>
    </div>

    
    
      <div class="flexrow categorybox" id="pizza_link">
        <img src="img/pizza.png" alt="pizza" class="category_icon">
        <div class="category_text" id="pizza_text">Pizza</div>
      </div>
    


    <div class="flexrow categorybox" id="burger_link">
      <img src="img/burger.png" alt="burger" class="category_icon">
      <div class="category_text">Burger</div>
    </div>


    <div class="flexrow categorybox" id="salad_link">
      <img src="img/salat.png" alt="salad" class="category_icon">
      <div class="category_text">Salate</div>
    </div>


    <div class="flexrow categorybox" id="pasta_link">
      <img src="img/pasta.png" alt="pasta" class="category_icon">
      <div class="category_text">Pasta</div>
    </div>


    <div class="flexrow categorybox" id="dessert_link">
      <img src="img/dessert.png" alt="dessert" class="category_icon">
      <div class="category_text">Dessert</div>
    </div>


    <div class="flexrow categorybox" id="colddrinks_link">
      <img src="img/juice.png" alt="cold drinks" class="category_icon">
      <div class="category_text">Kaltgetränke</div>
    </div>


    <div class="flexrow categorybox" id="hotdrinks_link">
      <img src="img/coffee.png" alt="coffee" class="category_icon">
      <div class="category_text">Heißgetränke</div>
    </div>


    <div class="navbar">
      <a href="index.html">
        <img class="navbar_image" src="img/homeicon.png" alt="home">
        <p>Home</p>
      </a>
      <a href="order.html">
        <img class="navbar_image" src="img/ordericon.png" alt="bestellung">
        <p>Bestellung</p>
      </a>
      <a href="filter.html">
        <img class="navbar_image" src="img/filtericon.png" alt="filter">
        <p>Filter</p>
      </a>
    </div>  


  </div>



    <!-- Scripts -->
    <script src="use_webworker.js"></script>
    <script src="use_serviceworker.js"></script>
    
  </body>

</html>
